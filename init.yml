tasks:
# random utilities
  - name: utils
    before: |
      sudo apt-get install tree
  - name: install-aws-cli
    run: |
      if ! command -v aws >/dev/null 2>&1; then
        cd /tmp
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        sudo ./aws/install
        rm -f awscliv2.zip
        rm -rf aws
      fi
