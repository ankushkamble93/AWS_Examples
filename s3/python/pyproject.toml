[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-bucket-demo"
version = "0.1.0"
description = "A simple Python project for creating and managing S3 buckets"
readme = "Readme.md"
requires-python = ">=3.9"
dependencies = ["boto3>=1.34"]

[project.scripts]
s3-bucket-demo = "s3_bucket_demo.main:main"
s3-example = "s3_bucket_demo.example:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
